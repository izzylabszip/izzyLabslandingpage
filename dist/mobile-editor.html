<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>izzyLabs Mobile Layout Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#161619;color:#eee;font:14px system-ui}main{display:flex;gap:28px;justify-content:center;padding:24px;flex-wrap:wrap}aside{width:310px}h1{font-size:24px}label{display:block;margin:15px 0}input,select,button{width:100%;padding:10px;background:#292930;color:white;border:1px solid #555;border-radius:8px}input[type=range]{padding:0}button{cursor:pointer;margin:6px 0}iframe{width:390px;height:680px;border:1px solid #555;border-radius:20px;background:black;max-width:100%}textarea{width:100%;height:160px;background:#222;color:#ddd}small{color:#aaa}output{float:right}</style><main><iframe id="phone" src="/" title="Actual mobile homepage"></iframe><aside><h1>Mobile layout editor</h1><p>This is your actual homepage. Select an element, then adjust its position and size.</p><label>Element<select id="element"><option value="art">Infinity</option><option value="bio">Bio</option><option value="apps">App names</option><option value="title">Headline</option></select></label><div id="controls"></div><button id="reset">Reset selected element</button><button id="copy">Copy layout settings</button><textarea id="result" readonly placeholder="Your settings appear here"></textarea><small>Changes are preview-only. Copy the settings and paste them into our chat to apply them to the live site.</small><p id="status"></p></aside></main><script>
const phone=document.querySelector('#phone'),select=document.querySelector('#element'),controls=document.querySelector('#controls');
const defaults={art:{x:-20,y:5,size:108},bio:{x:43,y:85,size:100},apps:{x:-5,y:0,size:100},title:{x:43,y:-35,size:100}};
let values=JSON.parse(JSON.stringify(defaults));
const selectors={art:'.minimal-art',bio:'.home-intro',apps:'.home-work-list',title:'.screen-headline'};
function apply(){const d=phone.contentDocument;if(!d)return;for(const [key,v] of Object.entries(values)){const el=d.querySelector(selectors[key]);if(!el)continue;el.style.translate=v.x+'px '+v.y+'px';el.style.scale=v.size/100;el.style.transformOrigin='center';}document.querySelector('#result').value=JSON.stringify({viewport:{width:390,height:680},adjustments:values},null,2);}
function render(){controls.innerHTML='';for(const [key,name,min,max] of [['x','Move left / right',-160,160],['y','Move up / down',-220,220],['size','Size (%)',30,160]]){let label=document.createElement('label');label.textContent=name;let out=document.createElement('output');out.textContent=values[select.value][key];let input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.value=values[select.value][key];input.oninput=()=>{values[select.value][key]=+input.value;out.textContent=input.value;apply()};label.append(out,input);controls.append(label)}}
phone.onload=()=>{apply();const d=phone.contentDocument;d.querySelectorAll('a,button').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation()},true));};
select.onchange=render;document.querySelector('#reset').onclick=()=>{values[select.value]={...defaults[select.value]};render();apply()};document.querySelector('#copy').onclick=async()=>{apply();try{await navigator.clipboard.writeText(document.querySelector('#result').value);document.querySelector('#status').textContent='Copied. Paste these settings into our chat.'}catch{document.querySelector('#result').select();document.querySelector('#status').textContent='Select and copy the settings above.'}};render();
</script>
