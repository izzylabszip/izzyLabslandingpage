<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>izzyLabs Desktop Cover Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#17171b;color:#eee;font:14px system-ui}main{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}#frame{position:relative;overflow:hidden;background:black;border:1px solid #555}iframe{width:1440px;height:810px;border:0;transform-origin:top left;pointer-events:none}h1{font-size:22px}label{display:block;margin:14px 0}select,input,button,textarea{width:100%;background:#292930;color:white;border:1px solid #555;border-radius:7px;padding:9px}input[type=range]{padding:0}button{cursor:pointer;margin:5px 0}textarea{height:150px}output{float:right}small{color:#aaa}@media(max-width:800px){main{grid-template-columns:1fr}}</style><main><div><div id="frame"><iframe id="page" src="/" title="Actual desktop hover cover"></iframe></div><p>Desktop canvas: 1440 × 810. Preview is scaled to fit your screen.</p></div><aside><h1>Desktop cover editor</h1><label>Cover<select id="cover"><option value="glow">Glow</option><option value="care">CareNearby</option><option value="lami">Lami Nepal</option><option value="all">All Work</option></select></label><label>Element<select id="element"></select></label><div id="controls"></div><button id="reset">Reset selected element</button><button id="copy">Copy all cover settings</button><textarea id="result" readonly></textarea><p id="status"></p><small>Preview only. Copy your settings and paste them into our chat to update the live covers. Each cover keeps its own adjustments.</small></aside></main><script>
const page=document.querySelector('#page'),frame=document.querySelector('#frame'),cover=document.querySelector('#cover'),element=document.querySelector('#element'),controls=document.querySelector('#controls');
const common={art:['Cover artwork','.care-hover-backdrop > img'],title:['Project name','.care-cover-copy h2'],bio:['Description','.care-cover-description'],category:['Category','.care-cover-category'],preview:['Small preview window','.care-hover-cover'],previewTitle:['Preview title','.care-hover-cover strong'],previewCategory:['Preview category','.care-hover-cover p']};
const all={art:['Infinity','.minimal-art'],title:['Headline','.screen-headline'],bio:['Bio','.home-intro'],apps:['App list','.home-work-list'],preview:common.preview,previewTitle:common.previewTitle,previewCategory:common.previewCategory};
const values={};for(const key of ['glow','care','lami','all']){values[key]={};for(const el of Object.keys(key==='all'?all:common))values[key][el]={x:0,y:0,size:100}}

const saved={"glow": {"title": {"x": -59, "y": 144, "size": 100}, "bio": {"x": -171, "y": 95, "size": 100}, "category": {"x": 134, "y": -89, "size": 100}}, "care": {"title": {"x": -85, "y": 140, "size": 100}, "bio": {"x": 144, "y": 113, "size": 100}, "category": {"x": 198, "y": -116, "size": 100}}, "lami": {"title": {"x": -91, "y": 128, "size": 100}, "bio": {"x": 64, "y": 89, "size": 100}, "category": {"x": 96, "y": -82, "size": 100}}, "all": {"art": {"x": -11, "y": 0, "size": 100}, "title": {"x": 15, "y": -73, "size": 100}, "bio": {"x": -39, "y": 10, "size": 100}, "preview": {"x": 37, "y": 0, "size": 90}}};for(const [p,es] of Object.entries(saved))Object.assign(values[p],es);
let ready=false;
function fit(){const scale=frame.clientWidth/1440;page.style.transform='scale('+scale+')';frame.style.height=810*scale+'px'}new ResizeObserver(fit).observe(frame);
function apply(){if(!ready)return;const d=page.contentDocument;for(const v of Object.values({...common,...all})){const el=d.querySelector(v[1]);if(el){el.style.translate='';el.style.scale='';}}
for(const [key,v] of Object.entries(values[cover.value])){const el=d.querySelector((cover.value==='all'?all:common)[key][1]);if(el){el.style.translate=v.x+'px '+v.y+'px';el.style.scale=v.size/100;el.style.transformOrigin='center';}}document.querySelector('#result').value=JSON.stringify({viewport:{width:1440,height:810},covers:values},null,2)}
function render(){controls.innerHTML='';for(const [k,label,min,max] of [['x','Left / right',-700,700],['y','Up / down',-400,400],['size','Size (%)',20,200]]){const l=document.createElement('label');l.textContent=label;const o=document.createElement('output');o.textContent=values[cover.value][element.value][k];const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.value=o.textContent;i.oninput=()=>{values[cover.value][element.value][k]=+i.value;o.textContent=i.value;apply()};l.append(o,i);controls.append(l)}}
function choose(){const mapping=cover.value==='all'?all:common;element.replaceChildren(...Object.entries(mapping).map(([key,v])=>new Option(v[0],key)));if(ready){const d=page.contentDocument;const link=d.querySelector(cover.value==='all'?'.home-work-list [data-all-work]':'.home-work-list [data-home-project="'+cover.value+'"]');link.dispatchEvent(new page.contentWindow.PointerEvent('pointerenter'));d.body.classList.add('care-preview-active');d.body.classList.toggle('work-preview-all',cover.value==='all');}render();apply()}
page.onload=()=>{ready=true;choose()};cover.onchange=choose;element.onchange=render;document.querySelector('#reset').onclick=()=>{values[cover.value][element.value]={x:0,y:0,size:100};render();apply()};document.querySelector('#copy').onclick=async()=>{apply();try{await navigator.clipboard.writeText(document.querySelector('#result').value);document.querySelector('#status').textContent='Copied—paste into our chat.'}catch{document.querySelector('#result').select();document.querySelector('#status').textContent='Copy the selected settings.'}};choose();fit();
</script>
